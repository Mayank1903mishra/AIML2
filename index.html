<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎵 SONG-BOX</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <div class="logo">🎵 SONG-BOX</div>

    <nav>
      <p class="nav-label">Your Library</p>
      <ul id="playlist">
        <!-- Songs will be added here by JavaScript -->
      </ul>
    </nav>
  </aside>

  <!-- ===== MAIN AREA ===== -->
  <main class="main">

    <!-- Album Art & Song Info -->
    <div class="now-playing">
      <div class="album-art" id="albumArt">🎵</div>
      <h2 id="songTitle">Select a Song</h2>
      <p id="artistName">— Artist —</p>
    </div>

    <!-- Progress Bar -->
    <div class="progress-area">
      <span id="currentTime">0:00</span>
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span id="totalTime">0:00</span>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button id="prevBtn" title="Previous">&#9664;&#9664;</button>
      <button id="playPauseBtn" title="Play / Pause">&#9654;</button>
      <button id="nextBtn" title="Next">&#9654;&#9654;</button>
    </div>

    <!-- Volume -->
    <div class="volume-area">
      <span>🔈</span>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.7" />
      <span>🔊</span>
    </div>

  </main>

  <!-- Hidden audio element -->
  <audio id="audioPlayer"></audio>

  <script src="script.js"></script>
</body>
</html>
